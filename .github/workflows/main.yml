name: Gerar APK Construlife

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Descompactar projeto
        run: |
          unzip -o construlife_github_apk_v2.zip -d projeto
          cp -R projeto/* .
          cp -R projeto/.[!.]* . 2>/dev/null || true
          rm -rf projeto
          
      - name: Corrigir configuração Java
        run: |
          find . -name "*.gradle" -type f -exec sed -i '/options.release/d' {} \;

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Construlife-APK
          path: app/build/outputs/apk/debug/app-debug.apk
